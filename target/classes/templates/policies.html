<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Policies - InsureFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:insert="header.html"></div>

    <h2 class="mb-4"><i class="bi bi-search"></i> Search Policies</h2>

    <div class="row">
        <div class="col-md-12">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h5 class="card-title">Available Policies</h5>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>Type</th>
                                    <th>Provider</th>
                                    <th>Premium</th>
                                    <th>Coverage</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="policy : ${policies}">
                                    <td th:text="${policy.type}"></td>
                                    <td th:text="${policy.provider}"></td>
                                    <td th:text="'$' + ${#numbers.formatDecimal(policy.premium, 1, 2)}"></td>
                                    <td th:text="'$' + ${#numbers.formatDecimal(policy.coverageAmount, 1, 2)}"></td>
                                    <td>
                                        <a th:href="'/policies/' + ${policy.policyId}" class="btn btn-sm btn-primary">
                                            <i class="bi bi-eye"></i> View
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div th:if="${#lists.isEmpty(policies)}" class="alert alert-info">
                        No policies available at the moment.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:insert="footer.html"></div>
</body>
</html>
