<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Policies - InsureFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:insert="header.html"></div>

    <h2 class="mb-4"><i class="bi bi-gear"></i> Manage Policy Templates</h2>

    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Create New Template</h5>
                    <form method="POST" action="/policies/admin/create">
                        <div class="mb-3">
                            <label for="type" class="form-label">Policy Type</label>
                            <select class="form-select" id="type" name="type" required>
                                <option value="">Select Type</option>
                                <option value="health">Health</option>
                                <option value="auto">Auto</option>
                                <option value="home">Home</option>
                                <option value="life">Life</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="provider" class="form-label">Provider</label>
                            <input type="text" class="form-control" id="provider" name="provider" placeholder="e.g., InsureCo" required>
                        </div>
                        <div class="mb-3">
                            <label for="premium" class="form-label">Premium ($)</label>
                            <input type="number" class="form-control" id="premium" name="premium" step="0.01" required>
                        </div>
                        <div class="mb-3">
                            <label for="coverageAmount" class="form-label">Coverage Amount ($)</label>
                            <input type="number" class="form-control" id="coverageAmount" name="coverageAmount" step="0.01" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Create Template</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Policy Templates</h5>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Type</th>
                                    <th>Provider</th>
                                    <th>Premium</th>
                                    <th>Coverage</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="policy : ${policies}">
                                    <td th:text="${policy.policyId}"></td>
                                    <td th:text="${policy.type}"></td>
                                    <td th:text="${policy.provider}"></td>
                                    <td th:text="'$' + ${#numbers.formatDecimal(policy.premium, 1, 2)}"></td>
                                    <td th:text="'$' + ${#numbers.formatDecimal(policy.coverageAmount, 1, 2)}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div th:if="${#lists.isEmpty(policies)}" class="alert alert-info">
                        No policy templates available.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <br>
    <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>

    <div th:insert="footer.html"></div>
</body>
</html>
