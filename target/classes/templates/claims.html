<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Claims - InsureFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:insert="header.html"></div>

    <h2 class="mb-4"><i class="bi bi-clipboard-data"></i> My Claims</h2>

    <div class="mb-3">
        <a href="/claims/submit" class="btn btn-primary">Submit New Claim</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>Claim ID</th>
                            <th>Policy Type</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Submitted Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="claim : ${claims}">
                            <td th:text="${claim.claimId}"></td>
                            <td th:text="${claim.policy.type}"></td>
                            <td th:text="'$' + ${#numbers.formatDecimal(claim.amount, 1, 2)}"></td>
                            <td>
                                <span class="badge" 
                                      th:classappend="${claim.status == T(com.example.insureflow.model.ClaimStatus).APPROVED} ? 'bg-success' : 
                                                       ${claim.status == T(com.example.insureflow.model.ClaimStatus).REJECTED} ? 'bg-danger' : 
                                                       'bg-warning'" 
                                      th:text="${claim.status}"></span>
                            </td>
                            <td th:text="${claim.submittedDate}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${#lists.isEmpty(claims)}" class="alert alert-info">
                You have no claims yet.
            </div>
        </div>
    </div>

    <br>
    <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>

    <div th:insert="footer.html"></div>
</body>
</html>
