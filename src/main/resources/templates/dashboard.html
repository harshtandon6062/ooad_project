<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard - InsureFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">InsureFlow</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text">Welcome, <span th:text="${user.name}"></span></span>
                <a class="nav-link" href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2>Dashboard</h2>
        <div class="row">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Total Policies</h5>
                        <p class="card-text" th:text="${totalPolicies}"></p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Active Policies</h5>
                        <p class="card-text" th:text="${activePolicies}"></p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Total Claims</h5>
                        <p class="card-text" th:text="${totalClaims}"></p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Pending Claims</h5>
                        <p class="card-text" th:text="${pendingClaims}"></p>
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-4">
            <a href="/policies" class="btn btn-primary">View Policies</a>
            <a href="/claims" class="btn btn-secondary">View Claims</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
