<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Claim - InsureFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:insert="~{header.html}"></div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title"><i class="bi bi-file-earmark-plus"></i> Submit a Claim</h3>
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        
                        <form method="POST" action="/claims/submit">
                            <div class="mb-3">
                                <label for="policyId" class="form-label">Select Policy</label>
                                <select class="form-select" id="policyId" name="policyId" required>
                                    <option value="" th:if="${policyId == null}" selected disabled>Choose a policy</option>
                                    <option th:each="policy : ${policies}"
                                            th:value="${policy.policyId}"
                                            th:text="${policy.policyId + ' - ' + policy.type + ' (' + policy.status + ')'}"
                                            th:selected="${policyId == policy.policyId}">
                                    </option>
                                </select>
                                <div th:if="${policies.isEmpty()}" class="form-text text-danger">
                                    You do not have any active policies available to submit a claim.
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="amount" class="form-label">Claim Amount ($)</label>
                                <input type="text" class="form-control" id="amount" name="amount" required
                                       th:value="${amount}">
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" name="description" rows="4" required
                                          th:text="${description}"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Submit Claim</button>
                            <a href="/claims" class="btn btn-secondary">Cancel</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:insert="~{footer.html}"></div>
</body>
</html>
