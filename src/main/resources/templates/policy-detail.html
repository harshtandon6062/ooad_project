<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Policy Details - InsureFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:insert="header.html"></div>

    <div class="row">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="card-title" th:text="${'Policy: ' + policy.type.toUpperCase()}"></h3>
                    <div class="row mt-4">
                        <div class="col-md-6">
                            <p><strong>Provider:</strong> <span th:text="${policy.provider}"></span></p>
                            <p><strong>Premium:</strong> <span th:text="'$' + ${#numbers.formatDecimal(policy.premium, 1, 2)}"></span></p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>Coverage Amount:</strong> <span th:text="'$' + ${#numbers.formatDecimal(policy.coverageAmount, 1, 2)}"></span></p>
                            <p><strong>Status:</strong> <span class="badge bg-success" th:text="${policy.status}"></span></p>
                        </div>
                    </div>

                    <hr>

                    <h5>Get a Quote</h5>
                    <form method="POST" th:action="'/policies/' + ${policy.policyId} + '/quote'">
                        <div class="mb-3">
                            <label for="age" class="form-label">Your Age</label>
                            <input type="number" class="form-control" id="age" name="age" placeholder="e.g., 30" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Get Quote</button>
                        <a href="/policies" class="btn btn-secondary">Back</a>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:insert="footer.html"></div>
</body>
</html>
