<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Policies - InsureFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:insert="header.html"></div>

    <h2 class="mb-4"><i class="bi bi-file-earmark-text"></i> My Policies</h2>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>Policy ID</th>
                            <th>Type</th>
                            <th>Provider</th>
                            <th>Premium</th>
                            <th>Start Date</th>
                            <th>Expiry Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="policy : ${policies}">
                            <td th:text="${policy.policyId}"></td>
                            <td th:text="${policy.type}"></td>
                            <td th:text="${policy.provider}"></td>
                            <td th:text="'$' + ${#numbers.formatDecimal(policy.premium, 1, 2)}"></td>
                            <td th:text="${policy.startDate}"></td>
                            <td th:text="${policy.expiryDate}"></td>
                            <td>
                                <span class="badge" th:classappend="${policy.status == 'ACTIVE'} ? 'bg-success' : 'bg-secondary'" th:text="${policy.status}"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${#lists.isEmpty(policies)}" class="alert alert-info">
                You have no policies yet. <a href="/policies">Browse policies</a> to get started!
            </div>
        </div>
    </div>

    <br>
    <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>

    <div th:insert="footer.html"></div>
</body>
</html>
