<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote - InsureFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:insert="header.html"></div>

    <div class="row">
        <div class="col-md-8">
            <div class="card shadow-sm border-success">
                <div class="card-body">
                    <h3 class="card-title"><i class="bi bi-check-circle text-success"></i> Quote Generated Successfully</h3>
                    
                    <div class="row mt-4">
                        <div class="col-md-6">
                            <p><strong>Policy Type:</strong> <span th:text="${policy.type.toUpperCase()}"></span></p>
                            <p><strong>Provider:</strong> <span th:text="${policy.provider}"></span></p>
                            <p><strong>Base Premium:</strong> <span th:text="'$' + ${#numbers.formatDecimal(policy.premium, 1, 2)}"></span></p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>Estimated Premium:</strong> <span class="h4 text-primary" th:text="'$' + ${#numbers.formatDecimal(quote.premiumEstimate, 1, 2)}"></span></p>
                            <p><strong>Valid Until:</strong> <span th:text="${quote.validUntil}"></span></p>
                            <p><strong>Quote ID:</strong> <span th:text="${quote.quoteId}"></span></p>
                        </div>
                    </div>

                    <hr>

                    <form method="POST" action="/policies/purchase">
                        <input type="hidden" name="templateId" th:value="${policy.policyId}">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="startDate" class="form-label">Policy Start Date</label>
                                <input type="date" class="form-control" id="startDate" name="startDate" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="expiryDate" class="form-label">Policy Expiry Date</label>
                                <input type="date" class="form-control" id="expiryDate" name="expiryDate" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success">Purchase Policy</button>
                        <a href="/policies" class="btn btn-secondary">Back</a>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:insert="footer.html"></div>
</body>
</html>
